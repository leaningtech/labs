			<path d="M1 1 L10 6 L1 11" fill="none" stroke="#ffd633" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
		</marker>
		<clipPath id="window">
			<rect x="20" y="40" width="1570" height="760" rx="24"/>
		</clipPath>
	</defs>

	<rect width="1900" height="820" fill="#0d0d0e"/>

	<g clip-path="url(#window)">
