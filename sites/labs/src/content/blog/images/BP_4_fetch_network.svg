	<text fill="#fff" font-size="40" x="220" y="555">BrowserPod</text>
	<text fill="#fff" font-size="40" x="220" y="603">kernel</text>

	<rect x="480" y="160" width="1070" height="600" rx="16" fill="#121213" stroke="#fff" stroke-opacity=".14" stroke-width="2"/>

	<rect x="520" y="200" width="680" height="490" rx="16" fill="#18181b" stroke="#c73da6" stroke-opacity=".6" stroke-width="2"/>
	<text fill="#fafafa" font-size="34" x="860" y="258">Fetch network</text>

	<rect x="550" y="420" width="270" height="220" rx="12" fill="#c73da6"/>
	<text fill="#fff" font-size="40" x="685" y="500">TLS</text>
	<text fill="#fff" font-size="36" x="685" y="546">termination</text>

	<rect x="900" y="420" width="270" height="220" rx="12" fill="#c73da6"/>
	<text fill="#fff" font-size="40" x="1035" y="500">HTTP</text>
	<text fill="#fff" font-size="40" x="1035" y="548">parser</text>

	<rect x="1270" y="420" width="250" height="220" rx="12" fill="#c73da6"/>

	<g font-weight="400">
		<text fill="#fff" font-family="'Commit Mono', ui-monospace, monospace" font-size="38" x="1395" y="524">fetch()</text>
		<g fill="#fff" fill-opacity=".85" font-size="22">
			<text x="220" y="356">curl, npm, pnpm…</text>
			<text x="220" y="650">socket syscalls</text>
			<text x="685" y="590">certificate from</text>
			<text x="685" y="620">a per-boot CA</text>
			<text x="1035" y="600">bytes → Request</text>
			<text x="1395" y="585">customizable</text>
		</g>
		<g fill="#a1a1aa" font-size="26">
			<text x="220" y="740">Web Worker</text>
			<text x="1015" y="740">Main thread</text>
			<text x="1810" y="660">WWW</text>
		</g>
		<g fill="#d4d4d8" font-size="22" text-anchor="start">
			<text x="550" y="312">CA certificate, added to the</text>
			<text x="550" y="342">pod's trust store at boot</text>
		</g>
		<g fill="#ffd633" font-size="22">
			<text x="430" y="582">TCP</text>
			<text x="430" y="635">(TLS)</text>
			<text x="1640" y="510">HTTP(S)</text>
			<text x="1640" y="575">CORS</text>
			<text x="1640" y="603">rules</text>
			<text x="1640" y="631">apply</text>
		</g>
	</g>

