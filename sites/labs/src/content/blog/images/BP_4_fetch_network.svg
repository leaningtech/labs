	</g>
	<rect x="20" y="40" width="1570" height="760" rx="24" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="2"/>
	<circle cx="66" cy="80" r="12" fill="#2a2a2e"/>
	<circle cx="104" cy="80" r="12" fill="#2a2a2e"/>
	<circle cx="142" cy="80" r="12" fill="#2a2a2e"/>
