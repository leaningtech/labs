packages:
  - sites/*
  - packages/*

# Moved here from .npmrc: pnpm 11+ reads only auth/registry keys from .npmrc
# and silently ignores the rest.
frozenLockfile: true


allowBuilds:
  esbuild: true
  sharp: true

onlyBuiltDependencies:
  - esbuild
  - sharp
# ^Only here as fallback: Corepack gives Cloudflare the
# packageManager pnpm (>= 10.26.0), which reads allowBuilds.
