name: Lint

on:
  push:
    branches:
      - main
  pull_request:

# One run per ref: superseded runs are cancelled instead of queueing up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  astro:
    name: Astro
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # pnpm version comes from the "packageManager" field in package.json,
      # so Actions and local dev cannot drift apart.
      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v6
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Astro type declarations
        run: pnpm -r astro sync

      - name: Run astro check
        run: pnpm -r astro check

  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v6
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prettier
        run: pnpm prettier --check .

  prose_vale:
    name: Prose (Vale)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    # ADVISORY ONLY - this job must never block a merge.
    # Three independent guards, all required:
    #   continue-on-error  - the job cannot fail the workflow, even if Vale
    #                        itself crashes or `vale sync` cannot reach the net
    #   fail_on_error      - reviewdog does not exit non-zero on Vale errors
    #   level: warning     - findings surface as warnings, never as errors
    # Rules, vocabulary and alert level live in .vale.ini at the repo root.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - uses: errata-ai/vale-action@v3
        with:
          version: 3.20.0
          fail_on_error: false
          level: warning
          # Only annotate lines the PR actually touches - the repo has 300+
          # markdown files and "file"/"nofilter" would flood every review.
          filter_mode: added
          reporter: github-pr-annotations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
