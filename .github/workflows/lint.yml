name: Lint

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  astro:
    name: Astro
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v6
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Astro type declarations
        run: pnpm -r astro sync

      - name: Run astro check
        run: pnpm -r astro check

  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v6
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prettier
        run: pnpm prettier --check .

  prose_vale:
    name: Prose (Vale)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    # Advisory only, never blocks a merge. Expect MDX false positives (Vale
    # has no native MDX format), so do not make this a required check. To prove
    # it still runs, add "WebWorker" (deny.txt) to any .md in a test PR.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - uses: vale-cli/vale-action@v3
        with:
          version: 3.20.0
          fail_on_error: false
          level: warning
          filter_mode: added
          reporter: github-pr-annotations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
