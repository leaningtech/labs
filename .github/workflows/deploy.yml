name: Deploy

on:
  push:
    branches:
      - main

# Not cancel-in-progress: rsync --delete mid-transfer leaves the remote
# docs tree half-updated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cheerpj:
    name: cheerpj.com/docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v6
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: cd sites/cheerpj && pnpm install --frozen-lockfile

      - name: Build sites/cheerpj
        run: cd sites/cheerpj && pnpm run build

      - name: Deploy cheerpj.com/docs
        uses: burnett01/rsync-deployments@v9
        with:
          switches: -avzr --delete
          path: sites/cheerpj/dist/
          remote_path: ${{ secrets.RSYNC_DEPLOY_PATH }}
          remote_host: ${{ secrets.RSYNC_DEPLOY_HOST }}
          remote_port: ${{ secrets.RSYNC_DEPLOY_PORT }}
          remote_user: ${{ secrets.RSYNC_DEPLOY_USER }}
          remote_key: ${{ secrets.RSYNC_DEPLOY_KEY }}
