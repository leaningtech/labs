StylesPath = .github/styles
Vocab = LeaningTechnologies

MinAlertLevel = warning

[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = Vale

# Off: flagged 1400 ordinary tech terms as misspellings. Vale.Terms still
# enforces brand capitalisation, Vale.Avoid still blocks reject.txt.
Vale.Spelling = NO

# Vale has no native MDX parser, so imports, URLs, code spans and filenames
# all reach it as prose. Regexes must be bare; wrapping them in () breaks them.
BlockIgnores = (?m)^import .*$
TokenIgnores = https?://\S+, `[^`]+`, \S+\.(?:wasm|js|mjs|ts|json|astro|svelte|html|css|toml|yml)
