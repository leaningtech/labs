StylesPath = .github/styles
Vocab = LeaningTechnologies

MinAlertLevel = warning

[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = Vale

# Off: flagged 1400 ordinary tech terms as misspellings.
Vale.Spelling = NO

# Vale has no MDX parser, so code reaches it as prose. Backticks need the
# capture group or earlier matches on the line are dropped; the others stay bare.
BlockIgnores = (?m)^import .*$
TokenIgnores = https?://\S+, (`[^`]+`), \S+\.(?:wasm|js|mjs|ts|json|astro|svelte|html|css|toml|yml)
